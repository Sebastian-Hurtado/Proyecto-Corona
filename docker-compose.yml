services:
  postgres:
    image: postgres:16-alpine
    container_name: corona-talent-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: corona_talent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./api/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  postgres-data:
